<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title description">
  <title id="title">How the Part Central database connects</title>
  <desc id="description">Selected relationships in the shared PostgreSQL database. Parts have revisions, revisions have operations, and operations have inspection characteristics. Jobs group inspection sheets, which pin a revision and operation. Sheets contain readings evaluated against characteristics. Readings retain employee, shift and time; sheets retain their reference snapshot and completion signer. The detailed database map includes the remaining relationships.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#456c61"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #173b31; }
      .section { font-size: 17px; font-weight: 700; letter-spacing: 2px; fill: #5c776c; }
      .heading { font-size: 27px; font-weight: 700; }
      .table { font-family: Consolas, 'Liberation Mono', monospace; font-size: 19px; fill: #496b5e; }
      .summary { font-size: 20px; fill: #51645c; }
      .label { font-size: 19px; fill: #456c61; }
      .edge { fill: none; stroke: #456c61; stroke-width: 2.4; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1440" height="810" rx="20" fill="#f5f8f6"/>
  <text x="48" y="63" font-size="38" font-weight="700">How the database connects</text>
  <text x="48" y="101" font-size="22" fill="#51645c">Shared-server mode · PostgreSQL · selected relationships</text>

  <text x="48" y="151" class="section">ENGINEERING LIBRARY</text>
  <rect x="48" y="177" width="284" height="150" rx="13" fill="#ffffff" stroke="#cad9d1" stroke-width="1.5"/>
  <rect x="48" y="177" width="284" height="6" rx="3" fill="#31745b"/>
  <text x="70" y="219" class="heading">Parts</text>
  <text x="70" y="252" class="table">parts</text>
  <text x="70" y="294" class="summary">Part number and name</text>

  <rect x="400" y="177" width="284" height="150" rx="13" fill="#ffffff" stroke="#cad9d1" stroke-width="1.5"/>
  <rect x="400" y="177" width="284" height="6" rx="3" fill="#31745b"/>
  <text x="422" y="219" class="heading">Revisions</text>
  <text x="422" y="252" class="table">part_revisions</text>
  <text x="422" y="294" class="summary">Engineering definition</text>

  <rect x="752" y="177" width="284" height="150" rx="13" fill="#ffffff" stroke="#cad9d1" stroke-width="1.5"/>
  <rect x="752" y="177" width="284" height="6" rx="3" fill="#31745b"/>
  <text x="774" y="219" class="heading">Operations</text>
  <text x="774" y="252" class="table">operations</text>
  <text x="774" y="294" class="summary">Process step and setup</text>

  <rect x="1104" y="177" width="284" height="150" rx="13" fill="#ffffff" stroke="#cad9d1" stroke-width="1.5"/>
  <rect x="1104" y="177" width="284" height="6" rx="3" fill="#31745b"/>
  <text x="1126" y="219" class="heading">Characteristics</text>
  <text x="1126" y="252" class="table">characteristics</text>
  <text x="1126" y="294" class="summary">Limits and instructions</text>

  <path d="M332 252 H397" class="edge"/>
  <text x="366" y="233" text-anchor="middle" class="label">has</text>
  <path d="M684 252 H749" class="edge"/>
  <text x="718" y="233" text-anchor="middle" class="label">has</text>
  <path d="M1036 252 H1101" class="edge"/>
  <text x="1070" y="233" text-anchor="middle" class="label">has</text>

  <path d="M542 481 V330" class="edge"/>
  <text x="557" y="402" class="label">pins revision</text>
  <path d="M818 481 V382 H894 V330" class="edge"/>
  <text x="835" y="420" class="label">pins operation</text>
  <path d="M1246 327 V481" class="edge"/>
  <text x="1262" y="409" class="label">evaluates</text>

  <text x="48" y="457" class="section">INSPECTION HISTORY</text>
  <rect x="48" y="484" width="284" height="150" rx="13" fill="#ffffff" stroke="#cbd9e1" stroke-width="1.5"/>
  <rect x="48" y="484" width="284" height="6" rx="3" fill="#4f7990"/>
  <text x="70" y="526" class="heading">Jobs</text>
  <text x="70" y="559" class="table">jobs</text>
  <text x="70" y="601" class="summary">Job number</text>

  <rect x="500" y="484" width="360" height="150" rx="13" fill="#ffffff" stroke="#cbd9e1" stroke-width="1.5"/>
  <rect x="500" y="484" width="360" height="6" rx="3" fill="#4f7990"/>
  <text x="522" y="526" class="heading">Inspection sheets</text>
  <text x="522" y="559" class="table">inspection_runs</text>
  <text x="522" y="601" class="summary">Sample + pinned requirements</text>

  <rect x="1104" y="484" width="284" height="150" rx="13" fill="#ffffff" stroke="#cbd9e1" stroke-width="1.5"/>
  <rect x="1104" y="484" width="284" height="6" rx="3" fill="#4f7990"/>
  <text x="1126" y="526" class="heading">Readings</text>
  <text x="1126" y="559" class="table">measurements</text>
  <text x="1126" y="601" class="summary">Measured value and result</text>

  <path d="M332 559 H497" class="edge"/>
  <text x="415" y="540" text-anchor="middle" class="label">groups</text>
  <path d="M860 559 H1101" class="edge"/>
  <text x="982" y="540" text-anchor="middle" class="label">records</text>

  <rect x="48" y="673" width="1340" height="87" rx="12" fill="#e5eee9"/>
  <text x="70" y="708" font-size="23" font-weight="700">History stays connected.</text>
  <text x="70" y="740" font-size="20" fill="#466354">Readings keep employee, shift and time. Sheets keep their reference snapshot and completion signer.</text>
  <text x="48" y="792" font-size="18" fill="#5c776c">The detailed map also shows employee sessions, visual guides, sketches, and reference editions.</text>
</svg>
