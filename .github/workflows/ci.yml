name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      - run: python -m pytest api/tests -q

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: partcentral
          POSTGRES_USER: partcentral
          POSTGRES_PASSWORD: ci_only_ephemeral_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U partcentral -d partcentral"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      - name: Build the unprivileged API image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/ci-evidence
          docker build --file api/Dockerfile --tag part-central-api:ci . 2>&1 | tee docs/ci-evidence/api-image-build.txt
      - name: Verify PostgreSQL migration and seed
        working-directory: api
        env:
          DATABASE_URL: postgresql+psycopg://partcentral:ci_only_ephemeral_password@127.0.0.1:5432/partcentral
        run: |
          python -m alembic upgrade head
          python -m app.seed
          python -m app.seed
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          with TestClient(app) as client:
              assert client.get('/api/health').json()['status'] == 'ok'
              signed_in = client.post('/api/auth/login', json={'employeeNumber': '1234'})
              assert signed_in.status_code == 200, signed_in.text
              assert signed_in.json()['role'] == 'operator'
              catalog = client.get('/api/parts').json()
              assert len(catalog) >= 3, catalog
              part = client.get('/api/parts/DG-1042').json()
              created = client.post('/api/runs', json={
                  'partRevisionId': part['revision']['id'],
                  'operationId': part['operation']['id'],
                  'jobNumber': 'JOB-CI-001', 'inspector': 'CI inspector', 'lotNumber': 'CI-001', 'sampleNumber': '01',
              })
              assert created.status_code == 201, created.text
              assert created.json()['employeeNumber'] == '1234', created.text
              run_id = created.json()['id']
              for feature in part['features']:
                  measured = client.post(f'/api/runs/{run_id}/measurements', json={
                      'featureId': feature['id'], 'value': feature['nominal'], 'shift': '1',
                  })
                  assert measured.status_code == 201, measured.text
                  assert measured.json()['status'] == 'pass', measured.text
                  assert measured.json()['employeeNumber'] == '1234', measured.text
              completed = client.post(f'/api/runs/{run_id}/complete', json={'shift': '1'})
              assert completed.status_code == 200, completed.text
              assert completed.json()['overallStatus'] == 'pass', completed.text
              summaries = client.get('/api/runs', params={'jobNumber': 'JOB-CI-001', 'summary': 'true'}).json()
              assert any(item['id'] == run_id for item in summaries), summaries
              assert all('measurements' not in item for item in summaries), summaries
              locked = client.post(f'/api/runs/{run_id}/measurements', json={
                  'featureId': part['features'][0]['id'], 'value': 12.5, 'shift': '1',
              })
              assert locked.status_code == 409, locked.text
          PY



      - name: Verify declared relational implications
        run: python scripts/prove_design.py
      - name: PostgreSQL integrity, races, plans and 100-client regression gate
        env:
          DATABASE_URL: postgresql+psycopg://partcentral:ci_only_ephemeral_password@127.0.0.1:5432/partcentral
          API_WORKERS: '4'
          DB_POOL_SIZE: '5'
          DB_MAX_OVERFLOW: '5'
          ADMIN_TOKEN: ci_only_ephemeral_admin_key_0000000000
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/ci-evidence
          api_container="part-central-ci-api-${{ github.run_id }}-${{ github.run_attempt }}"
          asset_volume="part-central-ci-assets-${{ github.run_id }}-${{ github.run_attempt }}"
          collect_diagnostics() {
            result=$?
            docker logs "$api_container" > docs/ci-evidence/api-runtime.txt 2>&1 || true
            docker inspect --format '{{json .State}}' "$api_container" > docs/ci-evidence/api-container-state.json 2>&1 || true
            docker rm --force "$api_container" > /dev/null 2>&1 || true
            docker volume rm "$asset_volume" > /dev/null 2>&1 || true
            exit "$result"
          }
          trap collect_diagnostics EXIT
          # Use the production image's USER and initialized asset-volume ownership.
          # Host networking reaches the isolated PostgreSQL service published above.
          docker run --detach --name "$api_container" --network host \
            --mount "type=volume,source=$asset_volume,target=/srv/assets" \
            --env DATABASE_URL --env API_WORKERS --env DB_POOL_SIZE --env DB_MAX_OVERFLOW --env ADMIN_TOKEN \
            --env ASSET_STORAGE_DIR=/srv/assets \
            part-central-api:ci
          python - <<'PYWAIT'
          import httpx, time
          for attempt in range(60):
              try:
                  if httpx.get('http://127.0.0.1:8000/api/health', timeout=1).status_code == 200:
                      break
              except httpx.HTTPError:
                  pass
              time.sleep(.25)
          else:
              raise SystemExit('API readiness failed')
          PYWAIT
          docker exec "$api_container" python -m alembic check 2>&1 | tee docs/ci-evidence/alembic-check.txt
          for smoke in postgres_smoke shift_smoke reference_smoke catalog_smoke native_sketch_smoke; do
            docker exec "$api_container" python "tests/$smoke.py" 2>&1 | tee "docs/ci-evidence/$smoke.txt"
          done
          python scripts/database_audit.py > docs/ci-evidence/database-before.json
          python scripts/load_test.py --base-url http://127.0.0.1:8000 --users 100 --iterations 3 --max-p95-ms 1000 --output docs/ci-evidence/load-test.json
          python scripts/database_audit.py > docs/ci-evidence/database-after.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-integrity-and-latency
          path: docs/ci-evidence/
